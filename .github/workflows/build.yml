name: Build Blink Shell Debug
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Dependencies
        run: |
          chmod +x ./get_frameworks.sh ./get_resources.sh
          ./get_frameworks.sh
          ./get_resources.sh

      - name: Build Debug App
        run: |
          # We use 'build' in 'Debug' mode to bypass Code 74
          xcodebuild build \
            -project Blink.xcodeproj \
            -scheme Blink \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath ./build_output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Create IPA Structure
        run: |
          mkdir -p Payload
          # This finds the compiled .app even in messy Debug folders
          find ./build_output -name "*.app" -type d -exec cp -r {} Payload/ \;
          zip -r Blink.ipa Payload

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Blink-Debug-IPA
          path: Blink.ipa
