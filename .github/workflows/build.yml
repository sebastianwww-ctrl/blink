name: Build Blink

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Dependencies
        run: |
          chmod +x ./get_frameworks.sh ./get_resources.sh
          ./get_frameworks.sh
          ./get_resources.sh

      - name: Build App
        run: |
          xcodebuild build \
            -project Blink.xcodeproj \
            -scheme Blink \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath ./build_output

      - name: Archive App
        run: |
          # This command archives the built application, which is a standard step
          # for preparing an app. The output will be a .xcarchive file,
          # which contains the app bundle and debugging symbols.
          xcodebuild archive \
            -project Blink.xcodeproj \
            -scheme Blink \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath ./build_output \
            -archivePath ./build_output/Blink.xcarchive

      - name: Upload Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blink-Archive
          path: ./build_output/Blink.xcarchive
