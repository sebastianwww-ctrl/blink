# Language: YAML
name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Setup Ruby (example) for Podfile use case
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      # Example: Check if Podfile exists using a shell command
      - name: Check Podfile exists
        run: |
          if [ -f "Podfile" ]; then
            echo "Podfile exists"
          else
            echo "Podfile not found"
          fi

      # Use environment variables correctly
      - name: Print environment variable
        env:
          MY_VAR: HelloWorld
        run: echo ${{ env.MY_VAR }}

      # Run tests or other commands
      - name: Run tests
        run: |
          echo "Running tests..."
          # Example test command: replace with your real test command
          echo "Tests completed."
