name: Build Blink Shell
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Frameworks & Resources
        run: |
          chmod +x ./get_frameworks.sh ./get_resources.sh
          ./get_frameworks.sh
          ./get_resources.sh

      - name: Configure Signing
        run: |
          cp template_setup.xcconfig developer_setup.xcconfig
          sed -i '' 's/YOUR_DEVELOPER_ID/XYZ1234567/g' developer_setup.xcconfig

      - name: Build App
        run: |
          xcodebuild -project Blink.xcodeproj \
            -scheme Blink \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build_output \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO


      - name: Create IPA
        run: |
          mkdir -p Payload
          find ./build_output -name "Blink.app" -type d -exec cp -r {} Payload/ \;
          zip -r Blink.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blink-Custom-Build
          path: Blink.ipa
