# Language: YAML
name: CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Set up Node.js (example for a Node.js project)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: npm install

      # Step 4: Run tests
      - name: Run Tests
        run: npm test

      # Step 5: Build project (if applicable)
      - name: Build Project
        run: npm run build

      # Step 6: Conditional step example (avoiding unrecognized 'e' errors)
      - name: Deploy if on main branch
        if: github.ref == 'refs/heads/main'
        run: echo "Deploying application..."
