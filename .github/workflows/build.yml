name: Build Blink Shell Force
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Dependencies
        run: |
          chmod +x ./get_frameworks.sh ./get_resources.sh
          ./get_frameworks.sh
          ./get_resources.sh

      - name: Strip Signing Requirements
        run: |
          # This command removes the "Team" requirement from the project file
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = .*;//g' Blink.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = .*;//g' Blink.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;//g' Blink.xcodeproj/project.pbxproj

      - name: Build Unsigned
        run: |
          xcodebuild build \
            -project Blink.xcodeproj \
            -scheme Blink \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath ./build_output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Create IPA
        run: |
          mkdir -p Payload
          find ./build_output -name "*.app" -type d -exec cp -r {} Payload/ \;
          zip -r Blink.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blink-Final-Attempt
          path: Blink.ipa
