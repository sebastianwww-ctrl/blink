name: Build Blink IPA
on: [workflow_dispatch] # This lets you start the build manually

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build IPA
        run: |
          xcodebuild build -scheme Blink -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO
          mkdir -p Payload
          mv build/Release-iphoneos/Blink.app Payload/
          zip -r Blink.ipa Payload/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blink-Sideload-IPA
          path: Blink.ipa
