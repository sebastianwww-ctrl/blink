name: Build Blink Shell
on:
  workflow_dispatch: # Allows you to manually trigger the build

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive # CRITICAL: Pulls in SSH, Mosh, and OpenSSL

      - name: Setup Frameworks & Resources
        run: |
          chmod +x ./get_frameworks.sh ./get_resources.sh
          ./get_frameworks.sh
          ./get_resources.sh # Downloads low-level dependencies

      - name: Configure Signing
        run: |
          cp template_setup.xcconfig developer_setup.xcconfig
          # Using a placeholder ID since you'll re-sign with SideStore anyway
          sed -i '' 's/YOUR_DEVELOPER_ID/XYZ1234567/g' developer_setup.xcconfig

      - name: Build IPA
        run: |
          xcodebuild -project Blink.xcodeproj \
            -scheme Blink \
            -configuration Release \
            -sdk iphoneos \
            -allowProvisioningUpdates \
            build-for-testing \
            CODE_SIGNING_ALLOWED=NO | xcpretty # Build without local certs

      - name: Archive and Export
        run: |
          mkdir build_artifacts
          # This creates a folder to hold your finished app
          find . -name "*.app" -exec cp -r {} ./build_artifacts/ \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlinkShell-Unsigned-IPA
          path: build_artifacts/
