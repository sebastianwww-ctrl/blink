name: Build Blink Shell Custom
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive # Fetches SSH and Mosh dependencies

      - name: Setup Dependencies
        run: |
          chmod +x ./get_frameworks.sh ./get_resources.sh
          ./get_frameworks.sh
          ./get_resources.sh

      - name: Force Build Unsigned
        run: |
          xcodebuild -project Blink.xcodeproj \
            -scheme Blink \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build_output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            BITCODE_GENERATION_MODE=bitcode \
            COMPILER_INDEX_STORE_ENABLE=NO | xcpretty

      - name: Create IPA
        run: |
          mkdir -p Payload
          # This search looks everywhere in the build output for the actual app
          APP_PATH=$(find ./build_output -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Blink.app not found!"
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -r Blink.ipa Payload

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Blink-Sideload-Me
          path: Blink.ipa
