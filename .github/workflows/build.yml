name: Build Custom Blink (JIT Enabled)
on:
  workflow_dispatch: # This lets you start the build manually

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install Dependencies
        run: |
          brew install xcbeautify
          # Add any custom shell binaries here if needed

      - name: Build Unsigned IPA
        run: |
          xcodebuild -workspace Blink.xcworkspace \
            -scheme Blink \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            -archivePath $PWD/build/Blink.xcarchive \
            archive

      - name: Export IPA
        run: |
          mkdir -p $PWD/build/output
          xcodebuild -exportArchive \
            -archivePath $PWD/build/Blink.xcarchive \
            -exportOptionsPlist .github/workflows/exportOptions.plist \
            -exportPath $PWD/build/output \
            -allowProvisioningUpdates

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Blink-Custom-JIT
          path: build/output/*.ipa
