name: Build Blink Shell GPL
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Dependencies
        run: |
          chmod +x ./get_frameworks.sh ./get_resources.sh
          ./get_frameworks.sh
          ./get_resources.sh

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project Blink.xcodeproj \
            -scheme Blink \
            -configuration Release \
            -sdk iphoneos \
            -archivePath ./Blink.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Create IPA Structure
        run: |
          mkdir -p Payload
          # Moving the compiled app into the Payload folder
          cp -r ./Blink.xcarchive/Products/Applications/*.app Payload/
          zip -r Blink.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blink-Final-IPA
          path: Blink.ipa
