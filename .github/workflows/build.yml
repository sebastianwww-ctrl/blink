name: Build Blink Shell Custom
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive # Fetches SSH and Mosh dependencies

      - name: Setup Dependencies
        run: |
          chmod +x ./get_frameworks.sh ./get_resources.sh
          # We add '|| true' so the build continues even if a minor resource fails
          ./get_frameworks.sh || true
          ./get_resources.sh || true

      - name: Build App
        run: |
          # We use 'archive' instead of 'build'—it's more reliable for finding the app later
          xcodebuild archive \
            -project Blink.xcodeproj \
            -scheme Blink \
            -configuration Release \
            -sdk iphoneos \
            -archivePath ./Blink.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create IPA
        run: |
          mkdir -p Payload
          # This specifically looks inside the Archive we just created
          cp -r ./Blink.xcarchive/Products/Applications/Blink.app Payload/
          zip -r Blink.ipa Payload
